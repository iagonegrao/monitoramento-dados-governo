<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Órgão</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .form-container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .form-container input[type="text"], 
        .form-container input[type="url"], 
        .form-container input[type="file"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .form-container input[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .form-container input[type="submit"]:hover {
            background-color: #0056b3;
        }
        .mensagem {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
        }
        .sucesso {
            background-color: #d4edda;
            color: #155724;
        }
        .erro {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Cadastrar Órgão Responsável</h1>
        <form action="/cadastrar_orgao" method="POST" enctype="multipart/form-data">
            <label for="nome_orgao">Nome do Órgão:</label>
            <input type="text" id="nome_orgao" name="nome_orgao" required>

            <label for="site_oficial">Site Oficial:</label>
            <input type="url" id="site_oficial" name="site_oficial" required>

            <label for="logo">Logotipo:</label>
            <input type="file" id="logo" name="logo" accept="image/*">

            <input type="submit" value="Cadastrar">
        </form>

        {% if mensagem %}
            <div class="mensagem {{ 'sucesso' if 'sucesso' in mensagem else 'erro' }}">
                {{ mensagem }}
            </div>
        {% endif %}
    </div>
<!-- Botão de retorno para página inicial -->
<div style="text-align: center; margin-top: 20px;">
    <a href="{{ url_for('index') }}">
        <button style="
            padding: 10px 20px;
            background-color: #6c757d;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;">
            ⬅ Voltar à Página Inicial
        </button>
    </a>
</div>
</body>
</html>
